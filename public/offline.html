<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline — AthleteOS</title>
    <style>
      :root {
        --ink: #20211f;
        --muted: #6d706a;
        --accent: #263c2d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      main {
        min-height: 100dvh;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        padding-bottom: max(32px, env(safe-area-inset-bottom));
      }
      section {
        width: min(520px, 100%);
      }
      .eyebrow {
        display: block;
        margin-bottom: 20px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 16px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 8vw, 44px);
        font-weight: 400;
        line-height: 1.1;
      }
      p {
        margin: 0 0 24px;
        font-size: 18px;
        line-height: 1.6;
        color: #42453f;
      }
      button {
        font: inherit;
        font-weight: 650;
        border: 0;
        border-radius: 999px;
        padding: 13px 20px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <span class="eyebrow">AthleteOS</span>
        <h1>You’re offline</h1>
        <p>
          AthleteOS needs a connection to load your latest workspace and continue the conversation.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
      </section>
    </main>
  </body>
</html>
